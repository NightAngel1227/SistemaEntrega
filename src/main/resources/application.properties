spring.application.name=sistema-entrega

# ---- Banco de dados MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_entrega?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
# Chave em Base64 usada para assinar os tokens (troque em produção)
security.jwt.secret=NDNmZDQ1M2E0OTMwODZhMWQwNjQ1NmQ0NmZmMzY3ZDY4MzVjMTIzNGY2NzhhYmNkMTIzNDU2Nzg5MGFiY2RlZg==
security.jwt.expiration-ms=86400000

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Porta ----
server.port=8080
